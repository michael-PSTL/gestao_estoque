<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | ControleDeEstoque</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body data-page="cadastro">
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="conteudo" class="main" tabindex="-1">
      <header class="page-header">
        <h1>Cadastro de produtos</h1>
        <p>Adicione um item ao estoque. O valor total é descontado do saldo mensal.</p>
      </header>

      <section class="card" aria-labelledby="t-form">
        <h2 id="t-form">Novo item</h2>
        <form id="form-produto" class="form-grid" novalidate>
          <div class="field field--full">
            <label for="nome">Nome do produto</label>
            <input id="nome" name="nome" data-campo="nome" type="text" maxlength="100" autocomplete="off" required aria-describedby="erro-nome">
            <span class="field-error" id="erro-nome" data-erro-de="nome"></span>
          </div>
          <div class="field">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" data-campo="categoria" required aria-describedby="erro-categoria">
              <option value="">Selecione…</option>
            </select>
            <span class="field-error" id="erro-categoria" data-erro-de="categoria"></span>
          </div>
          <div class="field">
            <label for="quantidade">Quantidade</label>
            <input id="quantidade" name="quantidade" data-campo="quantidade" type="number" min="0" step="1" inputmode="numeric" required aria-describedby="erro-quantidade">
            <span class="field-error" id="erro-quantidade" data-erro-de="quantidade"></span>
          </div>
          <div class="field">
            <label for="preco">Preço unitário (R$)</label>
            <input id="preco" name="precoUnitario" data-campo="precoUnitario" type="number" min="0" step="0.01" inputmode="decimal" required aria-describedby="erro-precoUnitario">
            <span class="field-error" id="erro-precoUnitario" data-erro-de="precoUnitario"></span>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="btn-adicionar">Adicionar</button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="t-recentes">
        <h2 id="t-recentes">Últimos itens adicionados</h2>
        <ul id="lista-recentes" class="recentes" aria-live="polite"></ul>
      </section>
    </main>
  </div>
  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
